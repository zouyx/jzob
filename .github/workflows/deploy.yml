name: Build and Deploy

on:
  push:
    branches:
      - master
      - pages-*
  workflow_dispatch:

env:
  NOKOGIRI_USE_SYSTEM_LIBRARIES: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install system dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Jekyll and plugins
        run: |
          gem install jekyll -v 4.4.1
          gem install kramdown-parser-gfm jekyll-sitemap jekyll-feed jekyll-paginate-v2 jekyll-menus jekyll-analytics jekyll-seo-tag

      - name: Build site
        run: JEKYLL_ENV=production jekyll build --destination ./_site

      - name: Deploy to zouyx.github.io
        if: github.ref == 'refs/heads/master'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # Set up SSH with cleanup on exit
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          trap 'rm -f ~/.ssh/id_rsa' EXIT
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone the target repo and replace content
          git clone git@github.com:zouyx/zouyx.github.io.git /tmp/deploy
          rsync -av --delete --exclude '.git' ./_site/ /tmp/deploy/

          cd /tmp/deploy
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from zouyx/jzob@${{ github.sha }}"
          git push origin master
