name: Generate Hot AI Topic Post

on:
  workflow_dispatch:
    inputs:
      query:
        description: Google News search query used to find hot AI topics
        required: false
        default: 'AI OR "artificial intelligence" OR OpenAI OR Anthropic OR Claude OR Gemini OR DeepSeek OR Copilot when:1d'
      max_results:
        description: Number of candidate topics to inspect from Google News
        required: false
        default: '10'
      model:
        description: Legacy override applied to every generation stage when set
        required: false
        default: ''
      research_model:
        description: GitHub Models model ID used for the research stage
        required: false
        default: openai/gpt-5
      writing_model:
        description: GitHub Models model ID used for the writing stage
        required: false
        default: openai/gpt-4.1
      review_model:
        description: GitHub Models model ID used for the review stage
        required: false
        default: openai/gpt-4.1
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: hot-ai-topic
  cancel-in-progress: false

jobs:
  generate-hot-ai-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate blog post from hot AI topic
        id: generate
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
          HOT_AI_TOPIC_QUERY: ${{ github.event.inputs.query || '' }}
          HOT_AI_TOPIC_MAX_RESULTS: ${{ github.event.inputs.max_results || '10' }}
          MODELS_MODEL: ${{ github.event.inputs.model || '' }}
          MODELS_RESEARCH_MODEL: ${{ github.event.inputs.model || github.event.inputs.research_model || 'openai/gpt-5' }}
          MODELS_WRITING_MODEL: ${{ github.event.inputs.model || github.event.inputs.writing_model || 'openai/gpt-4.1' }}
          MODELS_REVIEW_MODEL: ${{ github.event.inputs.model || github.event.inputs.review_model || 'openai/gpt-4.1' }}
        run: python3 script/generate_hot_ai_post.py

      - name: Commit generated post
        run: |
          if [ -z "$(git status --porcelain _posts)" ]; then
            echo "No new post generated."
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add _posts
          git commit -m "docs: add hot AI topic analysis"
          git push origin HEAD:master

      - name: Trigger deploy workflow
        if: steps.generate.outputs.post_file != ''
        run: |
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"master"}')
          if [ "$HTTP_STATUS" -ne 204 ]; then
            echo "Failed to trigger deploy workflow (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Deploy workflow triggered successfully (HTTP $HTTP_STATUS)"

      - name: Print summary
        if: steps.generate.outputs.post_file != ''
        run: |
          echo "Generated post: ${{ steps.generate.outputs.post_file }}"
          echo "Source: ${{ steps.generate.outputs.source_url }}"
